<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="recorder.css"></head>
<body>
<div class="recorder-layout">
  <div class="toolbar">
    <div class="mode-switch" role="tablist" aria-label="Audio source">
      <button id="live-tab" type="button" role="tab" aria-selected="true" aria-controls="live-panel" tabindex="0">Record Live</button>
      <button id="upload" type="button" role="tab" aria-selected="false" aria-controls="upload-panel" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></svg>Upload Audio</button>
    </div>
    <div id="live-panel" class="row controls" role="tabpanel" aria-labelledby="live-tab">
      <button id="record" type="button" disabled>Record</button><button id="pause" type="button" disabled hidden>Pause</button><button id="cancel" type="button" hidden>Cancel</button>
    </div>
    <div id="upload-panel" role="tabpanel" aria-labelledby="upload" hidden><span class="sr-only">Choose an audio recording in the upload area.</span></div>
  </div>
  <div class="visual"><div class="mic" aria-hidden="true"><svg viewBox="0 0 32 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="11" y="3" width="10" height="22" rx="5" fill="currentColor" stroke="none"/><path d="M6 18v3a10 10 0 0 0 20 0v-3M16 31v6m-5 0h10"/></svg></div><div id="timer" aria-label="Recorded duration">00:00</div><canvas id="waveform" width="580" height="92" aria-label="Microphone audio level" hidden></canvas></div>
  <div class="recording-actions"><span id="status" role="status" aria-live="polite">Ready</span><div id="library" class="row library"><button id="download" disabled>Download last recording</button><button id="again" disabled>Record again</button><button id="remove" disabled>Delete</button></div></div>
</div>
<div id="error" role="alert"></div><script src="recorder.js"></script>
</body></html>
